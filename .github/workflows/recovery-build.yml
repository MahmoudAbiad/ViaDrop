name: ViaDrop V1 ARM32 Release (QR + Audio)
on:
  push:
    branches: [recovery-dev]
  workflow_dispatch:
jobs:
  arm32-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Recreate missing Android scaffold
        run: flutter create --platforms=android --org app.viadrop --project-name viadrop .
      - name: Enable native audio and required platform permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          if 'externalNativeBuild' not in text:
              text = text.replace('android {', """android {
              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                  }
              }
          """, 1)
          # Flutter 3.47 supports Android API 24+; don't pretend that a
          # Galaxy J7 running Android 5/6 can install this build.
          if 'minSdk = flutter.minSdkVersion' not in text:
              raise SystemExit('Missing minSdk template; inspect Flutter scaffold')
          text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          gradle.write_text(text)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permissions = [
              'INTERNET', 'ACCESS_NETWORK_STATE', 'ACCESS_WIFI_STATE',
              'CHANGE_WIFI_MULTICAST_STATE', 'CAMERA', 'RECORD_AUDIO',
              'BLUETOOTH_CONNECT', 'BLUETOOTH_SCAN', 'BLUETOOTH', 'BLUETOOTH_ADMIN'
          ]
          additions = ''.join(
              f'    <uses-permission android:name="android.permission.{p}" />\n'
              for p in permissions
          )
          # LAN uses local HTTP solely as a carrier for authenticated VDP1
          # ciphertext. Android 9+ otherwise blocks cleartext HTTP by default.
          # Production should migrate to scoped network-security configuration
          # or TLS; this change is for the experimental Android build.
          text = text.replace('<application', additions +
              '    <application android:usesCleartextTraffic="true"', 1)
          manifest.write_text(text)
          PY
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Remove generated Flutter starter widget test
        run: |
          if [ -f test/widget_test.dart ] && grep -q 'MyApp()' test/widget_test.dart; then
            rm test/widget_test.dart
          fi
      - name: Remove obsolete generated starter test
        run: |
          if [ -f test/widget_test.dart ] && grep -q 'MyApp()' test/widget_test.dart; then
            rm test/widget_test.dart
          fi
      - name: Run Dart tests
        run: flutter test
      - name: Static analysis (fail on warnings and errors)
        run: flutter analyze --no-fatal-infos
      - name: Build optimized J7 ARM32 Release APK
        run: flutter build apk --release --target-platform android-arm --split-per-abi --tree-shake-icons
      - name: Check APK compatibility and size
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          "$AAPT" dump badging "$APK" > /tmp/viadrop-apk-badging.txt
          grep -Fx "sdkVersion:'24'" /tmp/viadrop-apk-badging.txt
          unzip -Z1 "$APK" | grep -Fx 'lib/armeabi-v7a/libflutter.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/armeabi-v7a/libviadrop_audio.so'
          if unzip -Z1 "$APK" | grep -Eq '^lib/(arm64-v8a|x86|x86_64)/'; then
            echo 'Unexpected architecture included in ARM32-only APK' >&2
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/ViaDrop-V1-J7-ARM32-release.apk
          size=$(stat -c%s "$APK")
          echo "ARM32 Release APK size: $size bytes"
          echo "### ViaDrop V1 — ARM32 Release APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Size: $size bytes. Min Android: 7.0 (API 24). ABI: armeabi-v7a." >> "$GITHUB_STEP_SUMMARY"
          echo "This is an optimized Release build signed for internal testing, not a Play Store production signing identity." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ARM32 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ViaDrop-V1-J7-ARM32-release
          path: dist/ViaDrop-V1-J7-ARM32-release.apk
          if-no-files-found: error
