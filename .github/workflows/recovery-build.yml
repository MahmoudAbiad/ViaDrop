name: ViaDrop V1 Modern ARM64 Release
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  VIADROP_COLOR_DEPS: ${{ github.workspace }}/.color-deps
jobs:
  arm64-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Simulate acoustic PCM round trips
        run: |
          g++ -std=c++17 -O2 -Iandroid/app/src/main/cpp/include test/native/audio_loopback.cpp android/app/src/main/cpp/ggwave-src/ggwave.cpp -o /tmp/viadrop-audio-test
          /tmp/viadrop-audio-test
      - name: Simulate fast OFDM and streaming receiver
        run: bash tools/test_ofdm.sh
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Recreate missing Android scaffold
        run: flutter create --no-pub --platforms=android --org app.viadrop --project-name viadrop .
      - name: Enable native audio and required platform permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          if 'externalNativeBuild' not in text:
              text = text.replace('android {', """android {
              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                  }
              }
          """, 1)
          # Flutter 3.47 supports Android API 24+; don't pretend that a
          # Android 6 devices can install this modern build.
          if 'minSdk = flutter.minSdkVersion' not in text:
              raise SystemExit('Missing minSdk template; inspect Flutter scaffold')
          text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          gradle.write_text(text)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permissions = [
              'INTERNET', 'ACCESS_NETWORK_STATE', 'ACCESS_WIFI_STATE',
              'CHANGE_WIFI_MULTICAST_STATE', 'CAMERA', 'RECORD_AUDIO',
              'BLUETOOTH_CONNECT', 'BLUETOOTH_SCAN', 'BLUETOOTH', 'BLUETOOTH_ADMIN'
          ]
          additions = ''.join(
              f'    <uses-permission android:name="android.permission.{p}" />\n'
              for p in permissions
          )
          # LAN uses local HTTP solely as a carrier for authenticated VDP1
          # ciphertext. Android 9+ otherwise blocks cleartext HTTP by default.
          # Production should migrate to scoped network-security configuration
          # or TLS; this change is for the experimental Android build.
          text = text.replace('<application', additions +
              '    <application android:usesCleartextTraffic="true"', 1)
          manifest.write_text(text)
          PY
      - name: Install pinned color NDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;28.2.13676358"'
      - name: Prepare pinned color codec, production Java and license bundle
        run: |
          bash tools/cimbar/prepare-app.sh
          python3 tools/cimbar/configure-gradle.py
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Remove generated Flutter starter widget test
        run: |
          if [ -f test/widget_test.dart ] && grep -q 'MyApp()' test/widget_test.dart; then
            rm test/widget_test.dart
          fi
      - name: Remove obsolete generated starter test
        run: |
          if [ -f test/widget_test.dart ] && grep -q 'MyApp()' test/widget_test.dart; then
            rm test/widget_test.dart
          fi
      - name: Run Dart tests
        run: flutter test
      - name: Static analysis (fail on warnings and errors)
        run: flutter analyze --no-fatal-infos
      - name: Build optimized Modern ARM64 Release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --tree-shake-icons
      - name: Check APK compatibility and size
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          SIGNER="${AAPT%/aapt}/apksigner"
          "$SIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" > /tmp/viadrop-apk-badging.txt
          grep -Fx "sdkVersion:'24'" /tmp/viadrop-apk-badging.txt
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libflutter.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libviadrop_audio.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libviadrop_color_jni.so'
          unzip -Z1 "$APK" | grep -Fx 'assets/viadrop-color-notices/SOURCE_MANIFEST.json'
          if unzip -Z1 "$APK" | grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/'; then
            echo 'Unexpected architecture included in ARM64-only APK' >&2
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/ViaDrop-V1-Modern-ARM64-release.apk
          size=$(stat -c%s "$APK")
          echo "ARM64 Release APK size: $size bytes"
          echo "### ViaDrop V1 — ARM64 Release APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Size: $size bytes. Min Android: 7.0 (API 24). ABI: arm64-v8a." >> "$GITHUB_STEP_SUMMARY"
          echo "This is an optimized Release build signed for internal testing, not a Play Store production signing identity." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ARM64 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ViaDrop-V1-Modern-ARM64-release
          path: dist/ViaDrop-V1-Modern-ARM64-release.apk
          if-no-files-found: error
      - name: Upload exact color covered source and notices
        uses: actions/upload-artifact@v4
        with:
          name: ViaDrop-color-covered-source
          path: dist/ViaDrop-color-covered-source.tar.gz
          if-no-files-found: error
