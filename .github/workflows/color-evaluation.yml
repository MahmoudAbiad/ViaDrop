name: CIMBAR isolated color evaluation
on:
  push:
    branches: [main]
    paths: ['tools/cimbar/**', 'components/color_codec/**', '.github/workflows/color-evaluation.yml', 'android/app/src/main/java/app/viadrop/viadrop/ColorSessionState.java', 'test/native/ColorSessionStateTest.java', 'tools/test_color_lifecycle.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-camera-api23:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Simulate color session ownership and cancellation
        run: bash tools/test_color_lifecycle.sh
      - name: Install minimum supported Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-23"'
      - name: Compile camera lifecycle and pixel adapters against API23
        run: bash tools/cimbar/android-java-check.sh
  color-codec-roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install host evaluation prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get install -y --no-install-recommends cmake g++ git python3 libopencv-dev libglfw3-dev libgles2-mesa-dev
      - name: Build pinned engine and test colored image round trips
        run: bash tools/cimbar/evaluate.sh
  android-native-color:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android NDK using runner SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'ndk;28.2.13676358' 'platforms;android-23'
      - name: Cross-compile isolated color JNI library
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358"
          bash tools/cimbar/android-build.sh '${{ matrix.abi }}'
