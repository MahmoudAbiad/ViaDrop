name: viadrop
description: Offline file sharing over light, sound, LAN and Bluetooth.
publish_to: none
version: 0.3.1+5
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.7
  cryptography: ^2.7.0
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  shared_preferences: ^2.5.4
  mobile_scanner: ^7.1.4
  qr_flutter: ^4.1.0
  permission_handler: ^12.0.1
  open_filex: ^4.7.0
  share_plus: ^12.0.1
  flutter_svg: ^2.2.3
  wakelock_plus: ^1.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2
flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/licenses/
    - THIRD_PARTY_NOTICES.md
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
